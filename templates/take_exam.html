{% extends 'base.html' %}{% block content %}<div class="exam-top"><div><p class="eyebrow">EXAM IN PROGRESS</p><h1>{{ attempt.exam.title }}</h1></div><div class="timer" id="timer" data-seconds="{{ remaining }}">--:--</div></div><form method="post" id="exam-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% for q in questions %}<section class="card"><h3>{{ loop.index }}. {{ q.text }}</h3>{% for key,label in [('A',q.option_a),('B',q.option_b),('C',q.option_c),('D',q.option_d)] %}<label class="choice"><input type="radio" name="q_{{ q.id }}" value="{{ key }}" {% if saved.get(q.id)==key %}checked{% endif %}> <b>{{ key }}.</b> {{ label }}</label>{% endfor %}</section>{% endfor %}<button class="btn secondary" name="action" value="save">Save answers</button> <button class="btn" name="action" value="submit" onclick="return confirm('Submit your exam now?')">Submit exam</button></form><script src="{{ url_for('static', filename='timer.js') }}"></script>{% endblock %}
