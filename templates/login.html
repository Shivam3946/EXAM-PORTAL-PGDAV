{% extends 'base.html' %}{% block title %}Sign in · Exam Portal{% endblock %}{% block content %}<section class="auth card"><h1>Welcome back</h1><p class="muted">Sign in to your examination workspace.</p><form method="post">{{ form.hidden_tag() }}<label>{{ form.email.label }}{{ form.email(placeholder='name@example.com') }}</label><label>{{ form.password.label }}{{ form.password() }}</label>{{ form.submit(class_='btn') }}</form><p><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p></section>{% endblock %}
